# 追加到主站 /opt/tmm/deploy/nginx/default.conf 末尾的 443 server 块。
#
# 用途：把 https://mushu.sfangjie.cn 反代到 mushu-app 容器（/opt/mushu 独立 compose 项目）。
# 注意：本文件是「需求副本」，实际生效的是服务器上的 default.conf。
# 改这里不会影响线上，必须同步到服务器并校验通过后 restart tmm-nginx。
#
# 与 web3d 不同：本站不做 Basic Auth，登录由应用自己做（Cookie 会话）。
server {
    listen 443 ssl;
    server_name mushu.sfangjie.cn;

    ssl_certificate     /etc/nginx/certs/mushu-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/mushu-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 正文整体上传可能略大，留出余量
    client_max_body_size 8m;

    # 变量式 proxy_pass：mushu-app 未启动时不影响主站配置加载
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mushu_upstream http://mushu-app:8787;

    location / {
        proxy_pass $mushu_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
